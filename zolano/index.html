<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111e1a">
  <title>ZOLANO 沙发产品库</title>
  <link rel="stylesheet" href="styles.css?v=191">
  <link rel="stylesheet" href="../pretty-images.css?v=130">
</head>
<body>
  <header class="topbar">
    <a class="back" href="../index.html" aria-label="返回">‹</a>
    <div>
      <strong>ZOLANO 沙发</strong>
      <span>原图模块 · 店面零售价 · 自动合计</span>
    </div>
    <button id="topButton" type="button" aria-label="回到顶部">↑</button>
  </header>

  <main>
    <section class="hero">
      <p>ZOLANO SOFA LIBRARY</p>
      <h1>进口沙发，<em>模块分开选。</em></h1>
      <span>进入型号后选择模块、数量和材质；零售价按原价 × 7.3 ÷ 0.66 × 2.8 自动计算。</span>
    </section>

    <section class="tools">
      <label class="search">
        <span>⌕</span>
        <input id="searchInput" type="search" placeholder="输入 ZL / FG 型号、系列名、配置、规格或材质" autocomplete="off">
      </label>
      <div class="filters" aria-label="筛选">
        <button class="active" type="button" data-filter="all">全部</button>
        <button type="button" data-filter="imported">截图导入</button>
        <button type="button" data-filter="final">Excel 价</button>
        <button type="button" data-filter="combo">组合</button>
        <button type="button" data-filter="single">单件</button>
        <button type="button" data-filter="photo">有照片</button>
      </div>
      <div class="sort-row">
        <span><strong id="resultCount">0</strong> 个系列</span>
        <select id="sortSelect" aria-label="排序">
          <option value="series">型号排序</option>
          <option value="price-asc">价格低到高</option>
          <option value="price-desc">价格高到低</option>
          <option value="count-desc">规格多到少</option>
        </select>
      </div>
    </section>

    <section id="grid" class="grid" aria-live="polite"></section>
  </main>

  <dialog id="dialog">
    <article>
      <button id="closeDialog" class="close" type="button" aria-label="关闭">×</button>
      <img id="detailImage" alt="">
      <div class="detail">
        <p id="detailSource"></p>
        <h2 id="detailTitle"></h2>
        <div id="detailMeta" class="detail-meta"></div>
        <div id="comboBuilder" class="combo-builder"></div>
        <div id="selectedSpec" class="selected-spec"></div>
        <div id="detailRows" class="detail-rows"></div>
      </div>
    </article>
  </dialog>

  <script src="photo-overrides.js?v=150"></script>
  <script src="zolano-data.js?v=100"></script>
  <script src="zolano-excel-price-overrides.js?v=100"></script>
  <script src="zolano-selling-overrides.js?v=100"></script>
  <script src="imported-zolano-screenshots.js?v=120"></script>
  <script src="spec-strips.js?v=170"></script>
  <script src="board-modules.js?v=191"></script>
  <script src="app.js?v=191"></script>
</body>
</html>
