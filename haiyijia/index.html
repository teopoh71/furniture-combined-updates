<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#17251f" />
    <title>嗨一家产品库</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css?v=110" />
    <link rel="stylesheet" href="../desktop-catalog.css?v=100" />
    <link rel="stylesheet" href="../pretty-images.css?v=130" />
  </head>
  <body class="haiyijia-desktop">
    <header class="topbar">
      <a class="home-button" href="../index.html" aria-label="返回产品库首页">‹</a>
      <div class="brand-mark" aria-hidden="true">嗨</div>
      <div class="brand-copy">
        <strong>嗨一家</strong>
        <span>独立产品库</span>
      </div>
      <button class="icon-button" id="scrollTopButton" type="button" aria-label="返回顶部">↑</button>
    </header>

    <main>
      <section class="hero">
        <p class="eyebrow">FOSHAN · SHUNDE</p>
        <h1>一把好椅子，<br /><em>先把材质看清楚。</em></h1>
        <p class="hero-note">佛山市嗨一家家具有限公司 · 仅收录本公司产品</p>
      </section>

      <section class="category-panel" aria-label="材质分类">
        <button class="category-card all active" type="button" data-filter="all">
          <span class="category-index">01</span>
          <span class="category-name">全部产品</span>
          <span class="category-count" data-count="all">792 款</span>
        </button>
        <button class="category-card leather" type="button" data-filter="full-leather">
          <span class="category-index">02</span>
          <span class="category-name">全皮专区</span>
          <span class="category-count" data-count="full-leather">24 款</span>
        </button>
        <button class="category-card other" type="button" data-filter="other">
          <span class="category-index">03</span>
          <span class="category-name">其他皮料</span>
          <span class="category-count" data-count="other">768 款</span>
        </button>
      </section>

      <section class="style-panel" aria-labelledby="styleTitle">
        <div class="style-heading">
          <div>
            <p class="eyebrow">CHAIR TYPE</p>
            <h2 id="styleTitle">按款式 / 规格分类</h2>
          </div>
          <span>可与材质一起筛选</span>
        </div>
        <div class="style-list">
          <button class="style-chip active" type="button" data-style="all-style"><span>全部款式</span><strong data-style-count>792</strong></button>
          <button class="style-chip" type="button" data-style="dining"><span>餐椅</span><strong data-style-count>223</strong></button>
          <button class="style-chip" type="button" data-style="tea"><span>茶椅</span><strong data-style-count>175</strong></button>
          <button class="style-chip" type="button" data-style="bar"><span>吧椅</span><strong data-style-count>67</strong></button>
          <button class="style-chip" type="button" data-style="single"><span>单椅</span><strong data-style-count>65</strong></button>
          <button class="style-chip" type="button" data-style="saddle"><span>马鞍椅</span><strong data-style-count>56</strong></button>
          <button class="style-chip" type="button" data-style="leisure"><span>休闲椅</span><strong data-style-count>122</strong></button>
          <button class="style-chip" type="button" data-style="table"><span>桌几</span><strong data-style-count>17</strong></button>
          <button class="style-chip" type="button" data-style="classic"><span>经典单椅</span><strong data-style-count>67</strong></button>
        </div>
      </section>

      <section class="catalog" aria-labelledby="catalogTitle">
        <div class="catalog-heading">
          <div>
            <p class="eyebrow">PRODUCT INDEX</p>
            <h2 id="catalogTitle">全部产品</h2>
          </div>
          <span id="resultCount" class="result-count">792</span>
        </div>

        <label class="search-box">
          <span aria-hidden="true">⌕</span>
          <input id="searchInput" type="search" placeholder="输入型号、颜色或材质" autocomplete="off" />
          <button id="clearSearch" type="button" aria-label="清除搜索">×</button>
        </label>

        <div id="emptyState" class="empty-state" hidden>
          <strong>没有找到这个型号</strong>
          <span>可试试只输入数字或材质名称</span>
        </div>
        <div id="productGrid" class="product-grid" aria-live="polite"></div>
        <button id="loadMore" class="load-more" type="button">继续显示</button>
      </section>
    </main>

    <footer>
      <strong>嗨一家家具</strong>
      <span>餐椅 · 马鞍椅 · 休闲椅 · 茶椅 · 吧椅</span>
      <small>资料来源：2026 年 4 月 28 日产品报价表</small>
    </footer>

    <dialog id="productDialog" class="product-dialog">
      <article>
        <button id="closeDialog" class="dialog-close" type="button" aria-label="关闭">×</button>
        <div class="dialog-image-wrap">
          <img id="dialogImage" alt="" />
          <span id="dialogBadge" class="dialog-badge"></span>
        </div>
        <div class="dialog-content">
          <p id="dialogSection" class="eyebrow"></p>
          <h2 id="dialogModel"></h2>
          <div id="dialogPrice" class="dialog-price"></div>
          <dl>
            <div><dt>款式分类</dt><dd id="dialogStyle"></dd></div>
            <div><dt>材质</dt><dd id="dialogMaterial"></dd></div>
            <div><dt>颜色 / 库存</dt><dd id="dialogColors"></dd></div>
            <div><dt>规格 / 包装</dt><dd id="dialogSpec"></dd></div>
            <div><dt>库存分类</dt><dd id="dialogStock"></dd></div>
          </dl>
        </div>
      </article>
    </dialog>

    <script src="products.js?v=110"></script>
    <script src="leisure-products.js?v=120"></script>
    <script src="app.js?v=120"></script>
    <script src="sort-dock.js?v=100"></script>
    <script src="../desktop-enhancements.js?v=100"></script>
  </body>
</html>
